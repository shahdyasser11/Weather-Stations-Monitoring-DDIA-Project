---
# STATION 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-station-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-station-1
  template:
    metadata:
      labels:
        app: weather-station-1
    spec:
      containers:
      - name: weather-station
        image: weather-station-image:v2
        imagePullPolicy: IfNotPresent
        command: ["java", "-cp", "/app/classes:/app/dependency/*", "com.weather.stations.WeatherStation", "1"]

